project:
  type: website
  output-dir: _site
  resources:
    - files/**
    - assets/**

website:
  title: "Jeroen Monnee"
  site-url: "https://jeroenmonnee.github.io"
  description: "Academic website of Jeroen Monnee, theoretical physicist working on string theory, quantum gravity, asymptotic Hodge theory, and Calabi–Yau compactifications."
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  back-to-top-navigation: true
  navbar:
    pinned: true
    collapse-below: lg
    logo: assets/logo.svg
    logo-alt: "JM"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Talks & Service"
        href: activities.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "CV"
        href: cv.qmd
  page-footer:
    border: false
    left: "© 2026 Jeroen Monnee"
    center: "Built with Quarto"
    right: "Hosted on GitHub Pages"

format:
  html:
    html-math-method: mathjax
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-location: right
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true

lang: en
